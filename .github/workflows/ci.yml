name: CI Laravel - LIC Pressing

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestionPressing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestionPressing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql
          tools: composer
          coverage: none

      - name: Vérifier PHP
        run: php -v

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Préparer le fichier .env
        run: cp .env.example .env

      - name: Générer la clé Laravel
        run: php artisan key:generate

      - name: Configurer PostgreSQL
        run: |
          php artisan config:clear

      - name: Exécuter les migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gestionPressing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Lancer les tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: gestionPressing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test
